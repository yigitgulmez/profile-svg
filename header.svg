<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <style>
    .bg-rect { animation: fade-in 0.9s ease-out both; }
    .name {
  animation: nameIn 10s ease-out forwards;
}

.underline {
  animation: underlineDraw 10s ease-out forwards;
  transform-origin: left center;
}

.meta {
  animation: fadeUp 10s ease-out forwards;
}

.corner {
  animation: cornerSlide 10s ease-out forwards;
}


    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes nameIn {
      0%, 4% { opacity: 0; transform: translateY(8px); }
      14%, 100% { opacity: 1; transform: translateY(0); }
    }


@keyframes underlineDraw {
  0%,14% {
    transform:scaleX(0);
  }

  24%,100% {
    transform:scaleX(1);
  }
}


@keyframes fadeUp {
  0%,19% {
    opacity:0;
    transform:translateY(6px);
  }

  33%,100% {
    opacity:1;
    transform:translateY(0);
  }
}


@keyframes cornerSlide {
  0%,8% {
    opacity:0;
    transform:translateX(-8px);
  }

  18%,100% {
    opacity:1;
    transform:translateX(0);
  }
}
  </style>
  <defs>
    <linearGradient id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop offset="0%" stop-color="#181320"/>
      <stop offset="20%" stop-color="#14131a"/>
      <stop offset="35%" stop-color="#101114"/>

      <stop offset="50%" stop-color="#0d0d10"/>

      <stop offset="65%" stop-color="#101114"/>
      <stop offset="80%" stop-color="#14131a"/>
      <stop offset="100%" stop-color="#181320"/>

    </linearGradient>
  </defs>
  <rect class="bg-rect" width="100%" height="100%" fill="url(#bg)" rx="14" ry="14"/>

  <!-- Corner decorations: outer <g> = position, inner <g> = animation -->
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#5b00b7" />
    <rect x="40" y="42" width="2" height="22" fill="#5b00b7" />
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#5b00b7" />
      <rect x="40" y="42" width="2" height="22" fill="#5b00b7" />
    </g>
  </g>

  <!-- Name -->
  <text class="name" x="400" y="138" text-anchor="middle" fill="#f7f7fb" font-family='Courier New' font-size="56" font-weight="700" letter-spacing="-1.5">Yiğit Gülmez</text>

  <!-- Accent underline -->
  <rect class="underline" x="232" y="164" width="336" height="2" fill="#5b00b7" rx="1"/>

  <!-- Meta line -->
  <text class="meta" x="400" y="200" text-anchor="middle" fill="#a5a5b3" font-family="monospace" opacity="0" font-size="15" letter-spacing="2">Just a someone trying to improve himself.</text>
</svg>