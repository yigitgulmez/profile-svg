<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 100 100">
  <style>
    @keyframes pulse-portfolio {
      0%, 100% {
        transform: scale(1);
        stroke-opacity: 0.3;
        filter: drop-shadow(0px 0px 2px rgba(167, 139, 250, 0.2));
      }
      50% {
        transform: scale(1.06);
        stroke-opacity: 0.9;
        filter: drop-shadow(0px 2px 10px rgba(167, 139, 250, 0.7));
      }
    }
    .btn-card {
      transform-origin: center;
      transform-box: fill-box;
      stroke-opacity: 0.3;
      animation: pulse-portfolio 2.6s ease-in-out infinite;
    }
    .icon-path { stroke: #a78bfa; }
    .btn-wrapper {
      opacity: 0;
      animation: fade-in 0.9s ease-out both;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

  <rect width="50" height="50" fill="none"/>
  <g class="btn-wrapper">
    <g class="btn-card">
      <rect x="29" y="29" width="42" height="42" rx="10" ry="10" fill="#201a35" stroke="#a78bfa" stroke-width="1.5"/>
      <g transform="translate(39, 39)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path class="icon-path" d="M15 16H17C19.2091 16 21 14.2091 21 12C21 9.79086 19.2091 8 17 8H15M8 12H16M9 8H7C6.27143 8 5.58835 8.19479 5 8.53513M3 12C3 14.2091 4.79086 16 7 16H9"/>
        </svg>
      </g>
    </g>
  </g>
</svg>
