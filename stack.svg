<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270">

  <style>
    .heading {
      animation: slidein 10s ease-out forwards;
    }

    .meta {
      animation: fade 10s ease-in-out;
    }
    .bg-rect { animation: fade-in 0.9s ease-out both; }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fade {
      0% {
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 1;
      }
    }

    .corner {
      animation: corner 10s ease-out;
    }

    @keyframes corner {
      0% {
        opacity: 0;
        transform: translateX(-8px);
      }

      25%, 100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .underline {
      animation: bar 10s ease-out;
      transform-origin: left center;
    }

    .chip {
      opacity: 0;

      transform-box: fill-box;
      transform-origin: center;

      animation: chipIn 6s ease-out forwards;

      animation-delay: calc(var(--i) * 0.08s);
    }
    .item-glow{
      filter: drop-shadow(0 0 8px rgba(91, 0, 183,.4));
    }


    @keyframes chipIn {

      0% {
        opacity:0;
        transform:translateY(6px);
      }

      20%, 100% {
        transform:translateY(0);
        opacity:1;
      }

    }

    @keyframes slidein {
      0% {
        opacity: 0;
        transform: translateX(-12px);
      }

      8% {
        opacity: 1;
        transform: translateX(0);
      }

      100% {
        transform: translateX(0);
      }
    }


    @keyframes bar {
      0%, 5% {
        transform: scaleX(0);
      }

      20% {
        transform: scaleX(1);
      }

      100% {
        transform: scaleX(1);
      }
    }


  </style>


  <!-- background -->

  <defs>
    <linearGradient id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

  <stop offset="0%" stop-color="#181320"/>
  <stop offset="20%" stop-color="#14131a"/>
  <stop offset="35%" stop-color="#101114"/>

  <stop offset="50%" stop-color="#0d0d10"/>

  <stop offset="65%" stop-color="#101114"/>
  <stop offset="80%" stop-color="#14131a"/>
  <stop offset="100%" stop-color="#181320"/>

    </linearGradient>
  </defs>

  <rect
    class="bg-rect"
    width="100%"
    height="100%"
    rx="14"
    fill="url(#bg)"
  />

  <g class="corner">
